{% extends 'predictor/base.html' %}

{% block content %}
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
    <div class="panel">
        <h2>Predict Quality from Parameters</h2>
        <form id="predict-form" method="post" action="{% url 'predict_quality' %}">
            {% csrf_token %}
            {% for param in params_config %}
            <div class="form-group">
                <label>{{ param.label }}</label>
                <input type="number" name="{{ param.name }}" step="0.1" required>
            </div>
            {% endfor %}
            <button type="submit">Predict Quality</button>
        </form>
    </div>
    <div class="output-panel">
        <h2>Prediction Result</h2>
        <div id="result-display-box" class="result-display">
            <p>Submit parameters to see a prediction.</p>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    const predictForm = document.getElementById('predict-form');
    const resultBox = document.getElementById('result-display-box');

    predictForm.addEventListener('submit', function(event) {
        event.preventDefault();
        resultBox.innerHTML = '<p>Predicting with ML model...</p>';
        const formData = new FormData(predictForm);

        fetch(predictForm.action, {
            method: 'POST',
            body: formData,
            headers: { 'X-CSRFToken': formData.get('csrfmiddlewaretoken'), 'X-Requested-With': 'XMLHttpRequest' }
        })
        .then(response => {
            if (!response.ok) {
                return response.json().then(err => { throw new Error(err.error || 'Prediction failed.') });
            }
            return response.json();
        })
        .then(data => {
            if (data.predicted_quality !== undefined) {
                const quality = data.predicted_quality.toFixed(2);
                resultBox.innerHTML = `<div class="prediction"><p>Predicted Quality Score:</p><span>${quality}</span></div>`;
            } else {
                throw new Error(data.error || "Invalid response from server.");
            }
        })
        .catch(error => {
            console.error('Error:', error);
            resultBox.innerHTML = `<p class="error">${error.message}</p>`;
        });
    });
</script>
{% endblock %}
